{% set python_min = "3.10" %}
{% set name = "txl-widgets" %}
{% set version = "0.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_widgets-{{ version }}.tar.gz
  sha256: ebe8d6d01ce575698d8b1894fb6446f81aedcbb98a1b96adb4e48b1721a8e0fb

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - ypywidgets >=0.9.4,<0.10.0
    - ypywidgets-textual >=0.5.4,<0.6.0
    - pycrdt >=0.10.9,<0.13.0

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_widgets

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/widgets
  summary: TXL plugin for widgets
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/widgets
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
